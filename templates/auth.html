<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Welcome - AI Document Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('abstract_docuchat_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center; /* Center the entire component on the page */
            min-height: 100vh;
            position: relative;
            padding: 1rem; /* Add some padding for smaller screens */
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(243, 244, 246, 0.8); /* Lighter overlay for a softer look */
            z-index: 0;
        }
        .auth-container {
            position: relative;
            z-index: 10; 
            background-color: white; 
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 56rem; /* max-w-5xl, increased width for two columns */
            overflow: hidden;
            display: flex; /* Key change: enables two-column layout */
        }
    </style>
</head>
<body>
    
    <div class="auth-container">
        <!-- Left Visual Panel (Visible on medium screens and up) -->
        <div class="hidden md:flex flex-col items-center justify-center w-1/2 bg-gray-800 p-12 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-24">
  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
</svg>
            <h2 class="text-3xl font-bold text-center">Secure & Intelligent</h2>
            <p class="mt-2 text-center text-gray-300">Unlock insights from your documents with our secure, AI-powered chat.</p>
        </div>

        <!-- Right Form Panel -->
        <div class="w-full md:w-1/2 p-8 md:p-12">
            <!-- Login View -->
            <div id="loginView">
                <header class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
                    <p class="text-gray-500 mt-3">Sign in to continue to DocuChat.</p>
                </header>
                
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="loginEmail" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-6">
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="loginPassword" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div id="loginErrorMessage" class="mb-4 text-center text-red-500 text-sm font-medium"></div>
                    <div class="mt-6">
                        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors">Sign In</button>
                    </div>
                </form>

                <p class="text-center text-sm text-gray-500 mt-6">
                    Don't have an account? <a href="#" id="showSignup" class="font-semibold text-blue-600 hover:underline">Sign Up</a>
                </p>
            </div>

            <!-- Sign-Up View -->
            <div id="signupView" class="hidden">
                 <header class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800">Create Account</h1>
                    <p class="text-gray-500 mt-3">Get started with your DocuChat account.</p>
                </header>
                
                <form id="signupForm">
                    <div class="mb-4">
                        <label for="signupName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="signupName" name="fullName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label for="signupEmail" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="signupEmail" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label for="signupPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="signupPassword" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                     <div class="mb-6">
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <div id="signupMessage" class="mb-4 text-center text-sm font-medium"></div>

                    <div class="mt-6">
                        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors">Create Account</button>
                    </div>
                </form>

                <p class="text-center text-sm text-gray-500 mt-6">
                    Already have an account? <a href="#" id="showLogin" class="font-semibold text-blue-600 hover:underline">Sign In</a>
                </p>
            </div>
        </div>
    </div>

<script>
// --- The JavaScript remains exactly the same as it correctly handles ---
// --- the logic within the right panel. No changes are needed here. ---
document.addEventListener('DOMContentLoaded', () => {
    // --- Views ---
    const loginView = document.getElementById('loginView');
    const signupView = document.getElementById('signupView');

    // --- Toggle Links ---
    const showSignupLink = document.getElementById('showSignup');
    const showLoginLink = document.getElementById('showLogin');
    
    // --- Forms ---
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    // --- Message Elements ---
    const loginErrorMessage = document.getElementById('loginErrorMessage');
    const signupMessage = document.getElementById('signupMessage');

    // --- Check for existing login ---
    if (localStorage.getItem('authToken')) {
        window.location.href = 'index.html';
    }

    // --- View Toggling Logic ---
    showSignupLink.addEventListener('click', (e) => {
        e.preventDefault();
        loginView.classList.add('hidden');
        signupView.classList.remove('hidden');
    });

    showLoginLink.addEventListener('click', (e) => {
        e.preventDefault();
        signupView.classList.add('hidden');
        loginView.classList.remove('hidden');
    });

    // --- Login Form Submission ---
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginErrorMessage.textContent = ''; 
        const email = e.target.email.value;
        const password = e.target.password.value;
        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Invalid email or password.');
            }
            const data = await response.json();
            localStorage.setItem('authToken', data.token);
            window.location.href = 'index.html';
        } catch (error) {
            loginErrorMessage.textContent = error.message;
        }
    });

    // --- Sign-Up Form Submission ---
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        signupMessage.textContent = '';
        signupMessage.className = 'mb-4 text-center text-sm font-medium'; // Reset classes

        const fullName = e.target.fullName.value;
        const email = e.target.email.value;
        const password = e.target.password.value;
        const confirmPassword = e.target.confirmPassword.value;
        
        if (password !== confirmPassword) {
            signupMessage.textContent = 'Passwords do not match.';
            signupMessage.classList.add('text-red-500');
            return;
        }

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, password })
            });

             if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Could not create account.');
            }
            const data = await response.json();

            signupMessage.textContent = 'Account created successfully! Please sign in.';
            signupMessage.classList.add('text-green-600');
            
            setTimeout(() => {
                signupView.classList.add('hidden');
                loginView.classList.remove('hidden');
                document.getElementById('loginEmail').value = email;
            }, 2000);

        } catch (error) {
             signupMessage.textContent = error.message;
             signupMessage.classList.add('text-red-500');
        }
    });
});
</script>

</body>
</html>
